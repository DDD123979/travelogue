<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="游迹">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff7e2"/>
      <stop offset="0.5" stop-color="#43cdf5"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>

    <!-- 单层小半径模糊：小尺寸下也不糊成一团 -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="32" y="47" text-anchor="middle"
        font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',sans-serif"
        font-size="54" font-weight="900"
        fill="url(#neon)" filter="url(#glow)">游</text>
</svg>
