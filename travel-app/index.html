<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游迹 · 发现你的下一场旅行</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 启动期错误兜底：任何脚本报错都在页面底部显红条，避免"白屏了却不知道为什么" -->
  <script>
    (function () {
      function show(kind, msg, where) {
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText = [
            'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:99999',
            'background:#b91c1c', 'color:#fff', 'padding:12px 16px',
            'font:12px/1.6 Consolas,monospace', 'white-space:pre-wrap', 'max-height:40vh',
            'overflow:auto'
          ].join(';');
          document.body.appendChild(box);
        }
        box.textContent += '[' + kind + '] ' + msg + (where ? '  @ ' + where : '') + '\n';
      }
      window.addEventListener('error', function (e) {
        var src = (e.filename || '').split('/').pop();
        show('error', e.message || String(e.error), src + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('promise', (r && (r.message || r)) || '未知错误');
      });
    })();
  </script>

  <div id="app"></div>

  <!-- Vue 3 本地运行库，无需联网 -->
  <script src="lib/vue.global.prod.js"></script>
  <!-- 本地示例数据：只有 file:// 打开时才用，必须先于 api.js 加载 -->
  <script src="js/mock-data.js"></script>
  <!-- 数据接口层：对接后端时只需修改此文件 -->
  <script src="js/api.js"></script>

  <!-- 以下按依赖顺序加载（没有打包工具，顺序就是依赖关系）：
       state 定义 store / 路由；card 与 markdown 是共用件；pages 各页面；最后 app.js 挂载 -->
  <script src="js/state.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/lib/markdown.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/list.js"></script>
  <script src="js/pages/detail.js"></script>
  <script src="js/pages/favorites.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/ranking.js"></script>
  <script src="js/pages/ai.js"></script>
  <!-- 应用入口：根组件与挂载，必须最后 -->
  <script src="js/app.js"></script>
</body>
</html>
