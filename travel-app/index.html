<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="游迹：旅游攻略与 AI 行程规划。Vue 3 + Spring Boot，按类型浏览目的地、看逐日行程，AI 流式生成个性化行程并用高德校准交通耗时。">
  <title>游迹 · 旅游攻略与 AI 行程规划</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css?v=20261129a">
  <!-- 首页克制动效增强层：覆盖在 style.css 之上，不改原有结构 -->
  <link rel="stylesheet" href="css/motion.css?v=20261128a">
</head>
<body>
  <!-- 启动期错误兜底：任何脚本报错都在页面底部显红条，避免"白屏了却不知道为什么" -->
  <script>
    (function () {
      function show(kind, msg, where) {
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'boot-error';
          box.style.cssText = [
            'position:fixed', 'left:0', 'right:0', 'bottom:0', 'z-index:99999',
            'background:#b91c1c', 'color:#fff', 'padding:12px 16px',
            'font:12px/1.6 Consolas,monospace', 'white-space:pre-wrap', 'max-height:40vh',
            'overflow:auto'
          ].join(';');
          document.body.appendChild(box);
        }
        box.textContent += '[' + kind + '] ' + msg + (where ? '  @ ' + where : '') + '\n';
      }
      window.addEventListener('error', function (e) {
        var src = (e.filename || '').split('/').pop();
        show('error', e.message || String(e.error), src + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('promise', (r && (r.message || r)) || '未知错误');
      });
    })();
  </script>

  <div id="app"></div>

  <!-- Vue 3 本地运行库，无需联网 -->
  <script src="lib/vue.global.prod.js"></script>
  <!-- 本地示例数据：只有 file:// 打开时才用，必须先于 api.js 加载 -->
  <script src="js/mock-data.js?v=20261031c"></script>
  <!-- 数据接口层：对接后端时只需修改此文件 -->
  <script src="js/api.js?v=20261031c"></script>

  <!-- 以下按依赖顺序加载（没有打包工具，顺序就是依赖关系）：
       state 定义 store / 路由；card 与 markdown 是共用件；pages 各页面；最后 app.js 挂载 -->
  <script src="js/state.js?v=20261128h"></script>
  <script src="js/data/china-pins.js?v=20261128c"></script>
  <script src="js/components/card.js?v=20261031c"></script>
  <script src="js/components/map-guide.js?v=20261128c"></script>
  <script src="js/lib/markdown.js?v=20261031c"></script>
  <script src="js/pages/home.js?v=20261128n"></script>
  <script src="js/pages/list.js?v=20261031c"></script>
  <script src="js/pages/detail.js?v=20261031c"></script>
  <script src="js/pages/favorites.js?v=20261031c"></script>
  <script src="js/pages/settings.js?v=20261031c"></script>
  <script src="js/pages/login.js?v=20261031c"></script>
  <script src="js/pages/ranking.js?v=20261031c"></script>
  <script src="js/pages/community.js?v=20261031c"></script>
  <script src="js/pages/profile.js?v=20261031c"></script>
  <script src="js/pages/ai.js?v=20261031c"></script>
  <!-- 应用入口：根组件与挂载，必须最后 -->
  <script src="js/app.js?v=20261129a"></script>
  <!-- 动效驱动：入场观察 + banner 视差，放在 app.js 之后等 DOM 挂载完 -->
  <script src="js/motion.js?v=20261127a"></script>
</body>
</html>
