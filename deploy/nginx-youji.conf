# 游迹 · Nginx 反向代理
# 放到 /etc/nginx/sites-available/youji 并软链到 sites-enabled/
# 申请证书后 certbot 会自动把 80 改成 301 跳转并补上 443 段

server {
    listen 80;
    server_name _;            # 有域名就换成 travel.example.com

    client_max_body_size 10m;

    # 静态资源压缩：vue.global.prod.js 167KB、style.css 35KB、api.js 20KB，
    # 不开 gzip 等于每次首屏都裸传；开了之后大约省 65% 流量。
    # 注意 SSE（/api/ai/itinerary）不要压缩，所以 /api/ 单独放行见下。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 接口返回的数据量小，且 AI 是 SSE 流式 —— 这里不压缩、不缓冲
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
