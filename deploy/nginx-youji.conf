# 游迹 · Nginx 反向代理
# 放到 /etc/nginx/sites-available/youji 并软链到 sites-enabled/
# 申请证书后 certbot 会自动把 80 改成 301 跳转并补上 443 段

server {
    listen 80;
    server_name _;            # 有域名就换成 travel.example.com

    client_max_body_size 10m;

    # 静态资源压缩：vue.global.prod.js 167KB、style.css 35KB、api.js 20KB，
    # 不开 gzip 等于每次首屏都裸传；开了之后大约省 65% 流量。
    # 注意 SSE（/api/ai/itinerary）不要压缩，所以 /api/ 单独放行见下。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---- 静态文件交给 Nginx 直接发 ----
    # 原来这些都走 proxy_pass 到 Spring：每张图都要进 JVM 的 ResourceHttpRequestHandler，
    # 多一次转发、多一份内存拷贝，图片一多就慢。这里直接读磁盘。

    # 用户上传的照片：长缓存（文件名是 UUID，内容永远不会变）
    location /uploads/ {
        alias /opt/youji/travel-app/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 封面图：同样文件名不变，可以长缓存
    location /img/ {
        alias /opt/youji/travel-app/img/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # 代码和样式改动频繁，只缓存 10 分钟，避免调试时拿到旧文件
    location /css/ {
        alias /opt/youji/travel-app/css/;
        expires 10m;
        access_log off;
    }

    location /js/ {
        alias /opt/youji/travel-app/js/;
        expires 10m;
        access_log off;
    }

    location = /index.html {
        alias /opt/youji/travel-app/index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 接口返回的数据量小，且 AI 是 SSE 流式 —— 这里不压缩、不缓冲
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
